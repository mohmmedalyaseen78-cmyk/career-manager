name: Build and test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run tests
        run: python -W ignore -m unittest tests.test_core -v

  bench-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build benchmark program
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name grafeco-bench bench.py
      - uses: actions/upload-artifact@v4
        with:
          name: grafeco-bench-windows
          path: dist/grafeco-bench.exe
